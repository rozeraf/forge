name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}

      - name: Install
        run: {{INSTALL_CMD}}

      - name: Lint
        run: {{RUN_CMD}} lint

      - name: Typecheck
        run: {{RUN_CMD}} typecheck

      - name: Test
        run: {{RUN_CMD}} test

      - name: Build
        run: {{BUILD_CMD}}

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/{{DEPLOY_BRANCH}}'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: {{NODE_VERSION}}

      - name: Install
        run: {{INSTALL_CMD}}

      - name: Deploy to Vercel
        run: npx vercel --prod --token ${{ secrets.VERCEL_TOKEN }}
