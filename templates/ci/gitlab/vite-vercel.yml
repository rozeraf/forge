image: node:{{NODE_VERSION}}

stages:
  - ci
  - deploy

cache:
  paths:
    - node_modules/

install:
  stage: ci
  script:
    - {{INSTALL_CMD}}
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 hour

lint:
  stage: ci
  needs: [install]
  script:
    - {{RUN_CMD}} lint

typecheck:
  stage: ci
  needs: [install]
  script:
    - {{RUN_CMD}} typecheck

test:
  stage: ci
  needs: [install]
  script:
    - {{RUN_CMD}} test

build:
  stage: ci
  needs: [install]
  script:
    - {{BUILD_CMD}}

deploy:
  stage: deploy
  needs: [lint, typecheck, test, build]
  only:
    - {{DEPLOY_BRANCH}}
  script:
    - npx vercel --prod --token $VERCEL_TOKEN
  environment:
    name: production
